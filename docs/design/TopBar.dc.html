<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workbench — Top bar</title>
<script src="./support.js"></script>
</head>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Orbitron:wght@500;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0B0C;--chrome:#111316;--panel:#0F1113;--card:#14171A;--raised:#1C1F24;--popover:#16191D;--line-soft:#1E2227;--line:#23272D;--line-strong:#2A2F36;--line-heavy:#343941;--text:#E7E9EC;--text-2:#C9CED4;--text-3:#A0A7B1;--muted:#8B93A0;--faint:#6B7380;--accent:#E8A15C;--on-accent:#0D0E10;--accent-bg:#2A2113;--accent-line:#5A4325;--accent-ring:rgba(232,161,92,0.12);--warn:#F0B27A;--ok:#5CC98A;--ok-bg:#0F1A14;--ok-line:#2E5A40;--ok-glow:rgba(92,201,138,0.2);--bad:#F2726A;--bad-bg:#2A1517;--info:#6CB6FF;--info-bg:#1A2433;--link:#9CC9FF;--link-hover:#C7E0FF;--link-line:#4A6A8F;--violet:#C3A4FF;--teal:#4FC1C9;--prio-high:rgba(242,114,106,0.13);--prio-mid:rgba(240,178,122,0.09);--prio-low:rgba(160,167,177,0.06);--shadow:rgba(0,0,0,0.6);--scrim:rgba(5,6,7,0.55);--display:Inter, system-ui, sans-serif;--title-glow:none;--accent-shadow:none;--chrome-edge:none;--bg-img:none}
body{margin:0}
.steam path{animation:steam 2.4s ease-in-out infinite;transform-box:fill-box}
.steam path:nth-child(2){animation-delay:.8s}
@keyframes steam{0%{opacity:0;transform:translateY(1.5px)}40%{opacity:1}100%{opacity:0;transform:translateY(-2px)}}
@media (prefers-reduced-motion: reduce){.steam path{animation:none}}

</style>
</helmet>
<div style="{{themeVars}} width: 100%; height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 0; padding: 0 12px; background: var(--chrome); border-bottom: 1px solid var(--line); box-shadow: var(--chrome-edge); position: relative; z-index: 1; color: var(--text-3); font-family: Inter, system-ui, sans-serif; font-size: 13px">

  <!-- App places: always there, never closable -->
  <nav aria-label="Workbench" style="display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 9px; background: var(--bg); border: 1px solid var(--line)">
    <a href="Today.dc.html" aria-current="{{todayCurrent}}" style="{{todayStyle}}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      Today
    </a>
    <a href="Services.dc.html" aria-current="{{localCurrent}}" style="{{localStyle}}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.5"></rect><rect x="3" y="14" width="18" height="6" rx="1.5"></rect><path d="M7 7h.01M7 17h.01"></path></svg>
      Local
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--warn)">6/8</span>
    </a>
  </nav>

  <span style="width: 1px; height: 24px; background: var(--line-strong); margin: 0 14px"></span>

  <!-- Sessions: closable, reorderable tabs -->
  <div role="tablist" aria-label="Sessions" style="flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 2px">
    <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--faint); margin-right: 8px">SESSIONS</span>
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="{{t.href}}" role="tab" aria-selected="{{t.selected}}" style="{{t.style}}">
        <span style="{{t.lineStyle}}" role="img" aria-label="{{t.stateLabel}}"></span>
        <span style="white-space: nowrap">{{t.title}}</span>
        <sc-if value="{{t.cafOn}}" hint-placeholder-val="{{false}}"><span style="margin-left: 7px; display: flex"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent); overflow: visible; flex-shrink: 0" role="img" aria-label="Kept awake"><path d="M7 11h9v3.5a3.5 3.5 0 0 1-3.5 3.5h-2A3.5 3.5 0 0 1 7 14.5z" fill="currentColor"/><path d="M16 12.2h1a1.6 1.6 0 0 1 0 3.2h-1"/><path d="M4 20.5h16"/><g class="steam"><path d="M10 5.5c-.8 1 .8 1.8 0 3"/><path d="M13.2 5.5c-.8 1 .8 1.8 0 3"/></g></svg></span></sc-if>
        <sc-if value="{{t.cafLid}}" hint-placeholder-val="{{false}}"><span style="margin-left: 7px; display: flex"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent); overflow: visible; flex-shrink: 0" role="img" aria-label="Kept awake with lid closed"><path d="M7 11h9v3.5a3.5 3.5 0 0 1-3.5 3.5h-2A3.5 3.5 0 0 1 7 14.5z" fill="currentColor"/><path d="M16 12.2h1a1.6 1.6 0 0 1 0 3.2h-1"/><path d="M4 20.5h16"/><g class="steam"><path d="M10 5.5c-.8 1 .8 1.8 0 3"/><path d="M13.2 5.5c-.8 1 .8 1.8 0 3"/></g><circle cx="19" cy="6" r="4.4" fill="var(--ko)" stroke="none"/><g style="color: var(--info)"><path d="M15.8 5.6h6.4" stroke-width="2.2"/><path d="M15 7.8h8"/></g></svg></span></sc-if>
      </a>
    </sc-for>
    <button aria-label="New session" style="height: 30px; width: 30px; border: 0; border-radius: 6px; background: transparent; color: var(--text-3); font-size: 16px; cursor: pointer">+</button>
  </div>

  <span style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); font-size: 12px; color: var(--muted)">
    Switch or run
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3)">⌘K</span>
  </span>
</div>
</x-dc>

class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'today';
    const place = (on) => `display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:6px;text-decoration:none;font-weight:${on ? 600 : 500};color:${on ? 'var(--on-accent)' : 'var(--text-2)'};background:${on ? 'var(--text)' : 'transparent'}`;
    const color = { running: 'var(--info)', waiting: 'var(--accent)', failing: 'var(--bad)', idle: 'var(--faint)' };
    const label = { running: 'Running', waiting: 'Waiting for you', failing: 'Last run failed', idle: 'Idle' };
    const tabs = [
      { key: 'ci', title: 'CI flakiness', state: 'running', href: 'Focus.dc.html', caf: 'on' },
      { key: 'e2e', title: 'Service discount e2e', state: 'waiting', href: 'Focus.dc.html' },
      { key: 'markup', title: 'Markup fixed amount', state: 'waiting', href: 'Task.dc.html', caf: 'lid' },
      { key: 'contact', title: 'Contact form', state: 'idle', href: 'Focus.dc.html' },
    ];
    return {
      themeVars: themeVars(this.props.theme),
      theme: this.props.theme || 'graphite',
      todayCurrent: active === 'today' ? 'page' : 'false',
      localCurrent: active === 'local' ? 'page' : 'false',
      todayStyle: place(active === 'today'),
      localStyle: place(active === 'local'),
      tabs: tabs.map((t) => {
        const on = t.key === active;
        return {
          ...t,
          selected: on ? 'true' : 'false',
          stateLabel: label[t.state],
          cafOn: t.caf === 'on',
          cafLid: t.caf === 'lid',
          style: `--ko:${on ? 'var(--line-soft)' : 'var(--chrome)'};position:relative;display:flex;align-items:center;height:100%;padding:0 14px;text-decoration:none;font-size:13px;color:${on ? 'var(--text)' : 'var(--text-3)'};background:${on ? 'var(--line-soft)' : 'transparent'};font-weight:${on ? 500 : 400}`,
          lineStyle: `position:absolute;left:8px;right:8px;height:${on ? 3 : 2}px;${on ? 'bottom:-1px' : 'top:0'};border-radius:${on ? '2px 2px 0 0' : '0 0 2px 2px'};background:${color[t.state]}`,

    };
