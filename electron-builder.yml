# Local, unsigned build into /Applications (see docs/SPEC.md › Packaging).
appId: dev.matej.workbench
productName: Workbench
directories:
  output: dist
files:
  - out/**
  - package.json
# node-pty and better-sqlite3 ship N-API prebuilds that already match Electron.
npmRebuild: false
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/node_modules/better-sqlite3/**'
extraResources:
  - from: resources/bin
    to: bin
  - from: resources/skills
    to: skills
mac:
  target:
    - target: dir
      arch: arm64
  category: public.app-category.developer-tools
  identity: null
